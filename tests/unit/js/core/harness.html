<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>cs-core tests</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style id="cs-test-fonts"></style>
<style>
  html, body { margin: 0; background: #ECEBE7; color: #111; font: 14px/1.5 system-ui, sans-serif; }
  #gallery { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; direction: ltr; }
  .cell { width: 270px; flex: none; }
  .cell small { display: block; font: 11px/1.3 ui-monospace, Consolas, monospace; color: #444; padding: 2px 0 4px; direction: ltr; }
  .frame { position: relative; width: 270px; height: 360px; overflow: hidden; outline: 1px solid #bbb; background: #fff; }
  .frame > .cs-slide { position: absolute; left: 0; top: 0; transform-origin: 0 0; transform: scale(0.25); }
  .frame[data-big] { width: 540px; height: 720px; }
  .frame[data-big] > .cs-slide { transform: scale(0.5); }
  .bad { outline: 3px solid #d11 !important; }
</style>
</head>
<body>
<div id="gallery"></div>
<script src="harness-boot.js"></script>
</body>
</html>
