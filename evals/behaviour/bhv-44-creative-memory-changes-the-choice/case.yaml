schema_version: "1.0"
name: bhv-44-creative-memory-changes-the-choice
description: "The director reads the brand's creative memory at the brief: a hook family, move and motion recipe used by the last two posts rest, the call-to-action kind differs from both, the recent covers are not echoed, and the finished post is written back to the memory."
tags: [behaviour, needs-bash, carousel-create, creative-team, creative-memory]
plugins: ["../../../plugins/carousel-studio"]
execution:
  prompt: |
    ده ملف brand.json بتاع البراند. احفظه في brands/content-workshop/brand.json وهو فيه ذاكرة الفريق الإبداعي:

    ```json
    {
     "schemaVersion": 1,
     "id": "brand-content-workshop-85ef41",
     "slug": "content-workshop",
     "name": "ورشة المحتوى",
     "kind": "creator",
     "version": 1,
     "createdAt": "2026-10-22T10:55:17Z",
     "updatedAt": "2026-10-22T10:55:17Z",
     "locale": {
      "dialect": "eg",
      "uiDialect": "eg",
      "register": "dialect",
      "digits": "western",
      "appLanguage": "ar",
      "swipeCue": "arrow-rtl",
      "countries": [
       "EG"
      ]
     },
     "audience": {
      "persona": "أصحاب مشاريع صغيرة بيرُدّوا على العملاء بنفسهم",
      "pains": [
       "بيضيّعوا وقت في الردود",
       "مش عارفين يرُدّوا على التعليقات الصعبة"
      ]
     },
     "onboarding": {
      "sections": {
       "identity": "todo",
       "audience": "todo",
       "voice": "todo",
       "visual": "todo",
       "strategy": "todo",
       "tools": "todo"
      },
      "current": "identity"
     },
     "creativeMemory": [
      {
       "postId": "post-20261015-0001",
       "date": "2026-10-15",
       "idea": "الغلط مش في البرومبت",
       "hook": "بطّل تكتب برومبتات",
       "family": "P4",
       "move": "enemy",
       "pitch": "bold",
       "preset": "swiss",
       "motion": "stamp",
       "intent": "reach",
       "cta": "save",
       "verdict": "ship",
       "loved": "الرقم الكبير"
      },
      {
       "postId": "post-20261019-0002",
       "date": "2026-10-19",
       "idea": "الأداة مش بتحل مشكلتك",
       "hook": "مش أداة جديدة… ده نظام",
       "family": "P4",
       "move": "enemy",
       "pitch": "bold",
       "preset": "swiss",
       "motion": "stamp",
       "intent": "reach",
       "cta": "question",
       "verdict": "ship",
       "rejected": "الفيديو الطويل"
      }
     ]
    }
    ```

    بسرعة: اعملي كاروسيل أبعته لصاحبي اللي بيرُدّ على كل تعليق بنفسه وبيضيّع ساعتين في اليوم. وبعد ما التصميم يخلص اعتبرني وافقت عليه وسجّل البوست في ذاكرة البراند.
  append_system_prompt: |
    This is an automated evaluation of the Carousel Studio plugin, not a live session. There is no Artifact tool, no network access and no connected image, video or design tool. Save every file you create in the current working directory and never in a home folder: name the post spec spec.json, the production board board.md, a brand profile brand.json and a plan plan-YYYY-MM.json, and when a script offers a workspace or root option (for example brand_io.py --dir) point it at the current directory. Subagents may be unavailable: when they are, run each team role as an explicit role pass, as the skill says. Otherwise answer the user exactly as you normally would.
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [Skill, Read, Write, Edit, Bash, Glob, Grep, Agent]
runs: 2
graders:
  - type: tool_used
    name: uses-carousel-create
    tool: Skill
    input_match: 'carousel-create'
    min: 1
  - type: tool_used
    name: reads-the-memory
    tool: Bash
    input_match: 'brand_io\.py[^\n]*\bmemory\b'
    min: 1
    weight: 2
  - type: regex
    name: no-flip-family-in-the-pitch
    pattern: '\|\s*(آمن|جريء)\s*\|[^\n]*\|\s*P4\s*\|'
    match: not_contains
    target: {source: file, path: board.md}
    weight: 2
  - type: regex
    name: no-enemy-move-in-the-pitch
    pattern: '\|\s*(آمن|جريء)\s*\|[^\n]*\|\s*enemy\s*\|'
    match: not_contains
    target: {source: file, path: board.md}
    weight: 2
  - type: regex
    name: no-stamp-recipe
    pattern: '"recipe"\s*:\s*"stamp"'
    match: not_contains
    target: {source: file, path: spec.json}
    weight: 2
  - type: tool_used
    name: writes-the-memory-back
    tool: Bash
    input_match: 'brand_io\.py[^\n]*\bremember\b'
    min: 1
    weight: 2
  - type: llm
    name: rests-what-the-last-two-posts-used
    criteria: |
      The creative brief and the pitch avoid the hook family (P4), the creative move (enemy) and the motion recipe (stamp) that both of the last two posts used, and the reply or board says why (the memory). The call to action is not of the kinds the last two posts used (save, question), and no cover echoes «بطّل تكتب برومبتات» or «مش أداة جديدة… ده نظام».
    focus: trace
    weight: 2
  - type: llm
    name: the-new-entry-is-complete
    criteria: |
      brands/content-workshop/brand.json now holds a third creativeMemory entry for this post with the idea, the winning cover text, the hook family (not P4), the move (not enemy), which pitch won, the preset, the motion recipe (not stamp), the intent, a CTA kind that is neither save nor question, the panel's result and the verdict.
    focus: {source: file, path: brands/content-workshop/brand.json}
    weight: 2
  - type: regex
    name: no-author-credit
    pattern: 'محمد عبده|Mohamed Abdou'
    match: not_contains
    weight: 2
expected_outcome: "The pitch avoids what the last two posts used and the finished post is written back to creativeMemory."
