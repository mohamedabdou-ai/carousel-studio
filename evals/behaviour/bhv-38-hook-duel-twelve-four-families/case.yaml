schema_version: "1.0"
name: bhv-38-hook-duel-twelve-four-families
description: "At least 12 hooks from 4 to 6 families go through a knockout duel decided on clarity first, with the audience panel's stop votes and cold reads; the podium of three comes from three different families."
tags: [behaviour, needs-bash, carousel-create, creative-team, hook-duel]
plugins: ["../../../plugins/carousel-studio"]
execution:
  prompt: |
    ده كابسول البراند بتاعي (ملف المشروع):

        [Carousel Studio brand capsule v1]
        brand: ورشة المحتوى (content-workshop) | dialect: eg | register: dialect | digits: western | swipe: arrow-rtl
        voice: ودود وعملي، جمل قصيرة. نستخدم «ببلاش» و«جرّب». لا نستخدم «ثورة» ولا «سر».
        palette: bg #F4F4F2 ink #111111 accent #E3262B | fonts: ibm-plex-sans-arabic / readex-pro / inter | preset: creator
        home: -

    بالفريق كله: كاروسيل عن إن النص الكتير في السلايد بيخلي الناس تعدّي. عايز الهوك يكسب بمبارزة بين الهوكات مش بمجرد درجة.
  append_system_prompt: |
    This is an automated evaluation of the Carousel Studio plugin, not a live session. There is no Artifact tool, no network access and no connected image, video or design tool. Save every file you create in the current working directory and never in a home folder: name the post spec spec.json, the production board board.md, a brand profile brand.json and a plan plan-YYYY-MM.json, and when a script offers a workspace or root option (for example brand_io.py --dir) point it at the current directory. Subagents may be unavailable: when they are, run each team role as an explicit role pass, as the skill says. Otherwise answer the user exactly as you normally would.
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [Skill, Read, Write, Edit, Bash, Glob, Grep, Agent]
runs: 2
graders:
  - type: tool_used
    name: uses-carousel-create
    tool: Skill
    input_match: 'carousel-create'
    min: 1
  - type: tool_used
    name: scores-the-drafts-with-the-script
    tool: Bash
    input_match: 'hook_features\.py'
    min: 1
    weight: 2
  - type: file_exists
    name: board-written
    path: "**/board.md"
  - type: regex
    name: duel-section-and-podium
    pattern: 'المنصة:\s*1\s+\S+\s*·\s*2\s+\S+\s*·\s*3\s+\S+'
    match: contains
    target: {source: file, path: board.md}
    weight: 2
  - type: regex
    name: cold-reads-recorded
    pattern: 'القراءة الباردة:'
    match: contains
    target: {source: file, path: board.md}
    weight: 2
  - type: tool_used
    name: runs-the-board-checker
    tool: Bash
    input_match: 'board_check\.py'
    min: 1
    weight: 2
  - type: llm
    name: twelve-hooks-four-families
    criteria: |
      The trace or board.md shows at least 12 candidate hooks drafted from at least 4 different hook families, at most 3 from any one family.
    focus: trace
    weight: 2
  - type: llm
    name: knockout-decided-on-clarity-first
    criteria: |
      The work shows a knockout bracket between family champions. Each duel names the criterion that decided it, in this order of priority: clarity (whether the personas' cold reads matched the hook's gap), then the panel's stop votes, then the gap, then fit and freshness. A hook that is clever but was misread is eliminated.
    focus: {source: file, path: board.md}
    weight: 2
  - type: llm
    name: podium-three-families
    criteria: |
      The final three hooks (the cover and two alternates) come from three different hook families and all passed the hard gates.
    weight: 2
  - type: regex
    name: no-author-credit
    pattern: 'محمد عبده|Mohamed Abdou'
    match: not_contains
    weight: 2
expected_outcome: "Twelve or more hooks from four to six families, a duel decided on clarity first, and a podium of three families."
