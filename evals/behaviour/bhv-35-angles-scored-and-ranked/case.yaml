schema_version: "1.0"
name: bhv-35-angles-scored-and-ranked
description: "Angles are produced as a scored, ranked list with a recommendation and no script."
tags: [behaviour, chat-only, content-angles, angles]
plugins: ["../../../plugins/carousel-studio"]
execution:
  prompt: |
    ده كابسول البراند بتاعي (ملف المشروع):

    [Carousel Studio brand capsule v1]
    brand: ورشة المحتوى (content-workshop) | dialect: eg | register: dialect | digits: western | swipe: arrow-rtl
    voice: ودود وعملي، جمل قصيرة. نستخدم «ببلاش» و«جرّب». لا نستخدم «ثورة» ولا «سر».
    palette: bg #F4F4F2 ink #111111 accent #E3262B | fonts: ibm-plex-sans-arabic / readex-pro / inter | preset: swiss
    home: -

    إيه الزوايا الممكنة لموضوع "أدوات مجانية بتغنيك عن المصمم"؟ عايز أختار قبل ما أكتب.
  append_system_prompt: |
    This is an automated evaluation of the Carousel Studio plugin, not a live session. There is no Artifact tool, no network access and no connected image, video or design tool. Save every file you create in the current working directory and never in a home folder: name the post spec spec.json, a brand profile brand.json and a plan plan-YYYY-MM.json, and when a script offers a workspace or root option (for example brand_io.py --dir) point it at the current directory. Otherwise answer the user exactly as you normally would.
  max_turns: 10
  timeout_seconds: 400
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 2
graders:
  - type: tool_used
    name: uses-content-angles
    tool: Skill
    input_match: 'content-angles'
    min: 1
  - type: llm
    name: five-numbered-angles
    criteria: |
      The reply shows at least 5 numbered angles in ranked order, each with a lens or a short title, a score or a one-line reason, one marked as the recommendation (the star or the words رأيي), and a single closing line offering to write this post in another dialect. It contains no hook list, slide script or caption.
    weight: 3
  - type: regex
    name: recommendation-marker
    pattern: '⭐|رأيي'
  - type: regex
    name: no-hashtags
    pattern: '(?<![\w&])#[^\s#\d]+'
    match: not_contains
  - type: llm
    name: answers-in-the-users-dialect
    criteria: |
      The reply is written in the user's own dialect rather than in formal Arabic or in English (tool, font and file names may stay Latin) and does not paste a whole slide script or a whole caption into the chat.
expected_outcome: "A ranked angle list and nothing beyond it."
