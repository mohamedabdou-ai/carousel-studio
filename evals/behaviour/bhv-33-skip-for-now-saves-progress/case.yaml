schema_version: "1.0"
name: bhv-33-skip-for-now-saves-progress
description: "Saying 'later' during setup saves progress, marks the sections skipped and explains how to resume."
tags: [behaviour, needs-bash, brand-setup, brand, onboarding]
plugins: ["../../../plugins/carousel-studio"]
execution:
  prompt: |
    ابدأ براند جديد اسمه ورشة المحتوى (slug: content-workshop)، مصري. القسم الأول: أنا مدرب لياقة وهدفي متابعين. وبعد كده أنا مستعجل: كفاية كده، بعدين نكمل.
  append_system_prompt: |
    This is an automated evaluation of the Carousel Studio plugin, not a live session. There is no Artifact tool, no network access and no connected image, video or design tool. Save every file you create in the current working directory and never in a home folder: name the post spec spec.json, a brand profile brand.json and a plan plan-YYYY-MM.json, and when a script offers a workspace or root option (for example brand_io.py --dir) point it at the current directory. Otherwise answer the user exactly as you normally would.
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Skill, Read, Write, Edit, Bash, Glob, Grep]
runs: 2
graders:
  - type: tool_used
    name: saves-with-the-script
    tool: Bash
    input_match: 'brand_io\.py'
    min: 1
  - type: file_exists
    name: brand-json-written
    path: "**/brand.json"
  - type: llm
    name: later-is-respected
    criteria: |
      The assistant accepts 'later' without pushing, says the progress is saved, and tells the user how to resume.
    weight: 3
  - type: llm
    name: sections-marked
    criteria: |
      In brand.json the identity section is done and the other onboarding sections are skipped or todo.
    focus: {source: file, path: brands/content-workshop/brand.json}
    weight: 2
expected_outcome: "Progress saved; the rest comes back later."
