schema_version: "1.0"
name: bhv-40-panel-drop-off-map
description: "The audience panel (three personas built from the brand's audience, assumptions marked) reads the script one slide at a time and returns a drop-off map with pull numbers; the weakest transition is rewritten once."
tags: [behaviour, needs-bash, carousel-create, creative-team, drop-off-map]
plugins: ["../../../plugins/carousel-studio"]
execution:
  prompt: |
    ده كابسول البراند بتاعي (ملف المشروع):

        [Carousel Studio brand capsule v1]
        brand: ورشة المحتوى (content-workshop) | dialect: eg | register: dialect | digits: western | swipe: arrow-rtl
        voice: ودود وعملي، جمل قصيرة. نستخدم «ببلاش» و«جرّب». لا نستخدم «ثورة» ولا «سر».
        palette: bg #F4F4F2 ink #111111 accent #E3262B | fonts: ibm-plex-sans-arabic / readex-pro / inter | preset: swiss
        home: -

    اعملي كاروسيل عن أخطاء تسعير الخدمات للمستقلين. جمهوري مستقلين ومصممين مبتدئين في مصر والخليج، بيشتكوا إن العملاء بيساوموا على السعر وإنهم مش عارفين يقولوا رقم. بعد ما تكتب السكريبت عايز اللجنة تقولي الناس هتبطّل تسحب عند أنهي سلايد.
  append_system_prompt: |
    This is an automated evaluation of the Carousel Studio plugin, not a live session. There is no Artifact tool, no network access and no connected image, video or design tool. Save every file you create in the current working directory and never in a home folder: name the post spec spec.json, the production board board.md, a brand profile brand.json and a plan plan-YYYY-MM.json, and when a script offers a workspace or root option (for example brand_io.py --dir) point it at the current directory. Subagents may be unavailable: when they are, run each team role as an explicit role pass, as the skill says. Otherwise answer the user exactly as you normally would.
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [Skill, Read, Write, Edit, Bash, Glob, Grep, Agent]
runs: 2
graders:
  - type: tool_used
    name: uses-carousel-create
    tool: Skill
    input_match: 'carousel-create'
    min: 1
  - type: file_exists
    name: board-written
    path: "**/board.md"
  - type: regex
    name: swipe-table
    pattern: '\|\s*الشخصية\s*\|\s*العمق\s*\|\s*الجذب'
    match: contains
    target: {source: file, path: board.md}
    weight: 2
  - type: regex
    name: weakest-transition-recorded
    pattern: 'أضعف انتقال:\s*s\d+→s\d+'
    match: contains
    target: {source: file, path: board.md}
    weight: 2
  - type: tool_used
    name: runs-the-board-checker
    tool: Bash
    input_match: 'board_check\.py'
    min: 1
    weight: 2
  - type: llm
    name: three-personas-from-the-audience
    criteria: |
      Three distinct audience personas were cast from the audience the user described (place, dialect, app language, moment, what they want, what annoys them), one core, one sceptic and one stretch. Anything the user did not say (age band, a name) is marked as an estimate («تقدير»).
    weight: 2
  - type: llm
    name: drop-off-map
    criteria: |
      The reaction includes a drop-off map: for each persona the slide where they stop swiping (or that they reach the last slide), the pull after each slide as a number from 0 to 3, and a save or send intent in which a send names a person.
    weight: 2
  - type: llm
    name: weakest-transition-fixed-once
    criteria: |
      After the map, the weakest transition is rewritten (the bridge that ends slide K and the first line of slide K+1 only), the reason is stated, and the persona who stopped reads again from slide K at most once.
    focus: trace
    weight: 2
  - type: regex
    name: no-author-credit
    pattern: 'محمد عبده|Mohamed Abdou'
    match: not_contains
    weight: 2
expected_outcome: "A drop-off map from three personas cast from the stated audience, and one fix of the weakest transition."
