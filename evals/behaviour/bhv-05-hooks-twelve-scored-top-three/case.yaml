schema_version: "1.0"
name: bhv-05-hooks-twelve-scored-top-three
description: "The hook engine drafts at least 12 hooks across at least 4 families, scores them, and shows the best 3 from 3 families."
tags: [behaviour, needs-bash, carousel-create, hooks-top3, hooks]
plugins: ["../../../plugins/carousel-studio"]
execution:
  prompt: |
    ده كابسول البراند بتاعي (ملف المشروع):

    [Carousel Studio brand capsule v1]
    brand: ورشة المحتوى (content-workshop) | dialect: eg | register: dialect | digits: western | swipe: arrow-rtl
    voice: ودود وعملي، جمل قصيرة. نستخدم «ببلاش» و«جرّب». لا نستخدم «ثورة» ولا «سر».
    palette: bg #F4F4F2 ink #111111 accent #E3262B | fonts: ibm-plex-sans-arabic / readex-pro / inter | preset: swiss
    home: -

    اكتبلي هوكات لكاروسيل عن إن النص الكتير في السلايد بيخلي الناس تعدّي. عايز أختار من أحسنهم.
  append_system_prompt: |
    This is an automated evaluation of the Carousel Studio plugin, not a live session. There is no Artifact tool, no network access and no connected image, video or design tool. Save every file you create in the current working directory and never in a home folder: name the post spec spec.json, a brand profile brand.json and a plan plan-YYYY-MM.json, and when a script offers a workspace or root option (for example brand_io.py --dir) point it at the current directory. Otherwise answer the user exactly as you normally would.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Write, Edit, Bash, Glob, Grep]
runs: 2
graders:
  - type: tool_used
    name: uses-carousel-create
    tool: Skill
    input_match: 'carousel-create'
    min: 1
  - type: tool_used
    name: scores-the-drafts-with-the-script
    tool: Bash
    input_match: 'hook_features\.py'
    min: 1
    weight: 2
  - type: llm
    name: twelve-drafts
    criteria: |
      The trace shows at least 12 candidate hooks being drafted and passed through hook_features.py.
    focus: trace
    weight: 2
  - type: llm
    name: top-three-from-three-families
    criteria: |
      The reply presents exactly 3 hooks that come from 3 different hook families, with a score or a reason for each.
    weight: 3
  - type: regex
    name: no-empty-hype
    pattern: 'الحقيقة الصادمة|سر خطير'
    match: not_contains
expected_outcome: "Three scored hooks from three families, out of at least twelve drafts."
