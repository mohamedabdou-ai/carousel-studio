schema_version: "1.0"
name: bhv-32-brand-voice-from-captions
description: "Past captions become a voice fingerprint, with three rewrites offered for confirmation."
tags: [behaviour, needs-bash, brand-setup, brand, voice]
plugins: ["../../../plugins/carousel-studio"]
execution:
  prompt: |
    سجّل براند اسمه ورشة المحتوى (slug: content-workshop)، مصري، مدرّب سوشيال ميديا. دي 4 كابشنات قديمة من صفحتي، اتعلم منها صوتي وكمّل الإعداد بالافتراضي:
    1) جرّبت أغيّر أول سلايد في كل بوست لمدة أسبوعين. الفرق في الحفظ كان واضح.
    2) مش لازم تبقى مصمم عشان تعمل كاروسيل محترف. ابدأ بفكرة واحدة في كل سلايد.
    3) أكتر سؤال بوصلني: أكتب كام سلايد؟ الإجابة: اللي يكفي الفكرة.
    4) الكابشن الطويل مش عيب لو كل سطر فيه فايدة. جرّب تكتب أول سطر لواحد مش متابعك.
  append_system_prompt: |
    This is an automated evaluation of the Carousel Studio plugin, not a live session. There is no Artifact tool, no network access and no connected image, video or design tool. Save every file you create in the current working directory and never in a home folder: name the post spec spec.json, a brand profile brand.json and a plan plan-YYYY-MM.json, and when a script offers a workspace or root option (for example brand_io.py --dir) point it at the current directory. Otherwise answer the user exactly as you normally would.
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Skill, Read, Write, Edit, Bash, Glob, Grep]
runs: 2
graders:
  - type: tool_used
    name: fingerprints-the-captions
    tool: Bash
    input_match: 'fingerprint\.py'
    min: 1
    weight: 2
  - type: tool_used
    name: saves-the-brand-with-the-script
    tool: Bash
    input_match: 'brand_io\.py'
    min: 1
  - type: file_exists
    name: brand-json-written
    path: "**/brand.json"
  - type: llm
    name: brand-json-shape
    criteria: |
      brand.json has locale.dialect eg, Western digits, and a voice.fingerprint object computed from the 4 captions.
    focus: {source: file, path: brands/content-workshop/brand.json}
    weight: 3
  - type: llm
    name: voice-in-plain-words
    criteria: |
      The reply describes the voice in plain words and offers three rewrites of the user's lines for confirmation.
    weight: 2
expected_outcome: "A fingerprint-based voice profile saved in brand.json."
