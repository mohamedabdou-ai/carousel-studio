schema_version: "1.0"
name: bhv-45-panel-does-not-flatter
description: "Given a script with one deliberately generic slide, the audience panel does not wave it through: at least one persona stops there or the weakest transition points at it, every reaction quotes the words on screen, and none of them praises the team."
tags: [behaviour, needs-bash, carousel-create, creative-team, panel-honest]
plugins: ["../../../plugins/carousel-studio"]
execution:
  prompt: |
    ده كابسول البراند بتاعي (ملف المشروع):

        [Carousel Studio brand capsule v1]
        brand: ورشة المحتوى (content-workshop) | dialect: eg | register: dialect | digits: western | swipe: arrow-rtl
        voice: ودود وعملي، جمل قصيرة. نستخدم «ببلاش» و«جرّب». لا نستخدم «ثورة» ولا «سر».
        palette: bg #F4F4F2 ink #111111 accent #E3262B | fonts: ibm-plex-sans-arabic / readex-pro / inter | preset: swiss
        home: -

    اللجنة تقرا السكريبت ده سلايد سلايد، وكل واحد منهم يقول هيبطّل يسحب فين. ما تجامليش. ده السكريبت (8 سلايدات، بوست عن ليه الكاروسيل مش بيتحفظ):

    1. الغلاف: «كاروسيلك مش بيتحفظ… عشان 3 أخطاء»
    2. «الخطأ 1: غلاف بيشرح بدل ما يشد. الغلاف إعلان للسلايد التانية.»
    3. «الخطأ 2: 3 أفكار في سلايد واحدة. فكرة واحدة بس تكفي.»
    4. «المحتوى مهم جدًا في عصرنا الحالي، وكل الناس بتستخدم السوشيال ميديا كل يوم، ولهذا السبب لازم نهتم بالجودة.»
    5. «الخطأ 3: دعوة قبل الفايدة. اطلب بعد ما تدّي.»
    6. «الحل: غلاف واحد، فكرة واحدة، دعوة واحدة.»
    7. «جرّب النهارده على آخر بوست كتبته.»
    8. «احفظ البوست ده قبل ما تكتب الجاي.»

    جمهوري: صنّاع محتوى مبتدئين في مصر والخليج، بيسكرولوا بالليل وبيزهقوا من الكلام النظري.
  append_system_prompt: |
    This is an automated evaluation of the Carousel Studio plugin, not a live session. There is no Artifact tool, no network access and no connected image, video or design tool. Save every file you create in the current working directory and never in a home folder: name the post spec spec.json, the production board board.md, a brand profile brand.json and a plan plan-YYYY-MM.json, and when a script offers a workspace or root option (for example brand_io.py --dir) point it at the current directory. Subagents may be unavailable: when they are, run each team role as an explicit role pass, as the skill says. Otherwise answer the user exactly as you normally would.
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [Skill, Read, Write, Edit, Bash, Glob, Grep, Agent]
runs: 2
graders:
  - type: tool_used
    name: uses-carousel-create
    tool: Skill
    input_match: 'carousel-create'
    min: 1
  - type: regex
    name: swipe-table
    pattern: '\|\s*الشخصية\s*\|\s*العمق\s*\|\s*الجذب'
    match: contains
    target: {source: file, path: board.md}
    weight: 2
  - type: tool_used
    name: runs-the-board-checker
    tool: Bash
    input_match: 'board_check\.py'
    min: 1
    weight: 2
  - type: llm
    name: someone-drops-at-the-generic-slide
    criteria: |
      At least one of the three personas stops before the last slide, and the stop is on slide 4 (the generic sentence about content in our age) or on a slide next to it, or the panel's weakest transition is the one around slide 4. A map in which all three personas reach the end with high pulls is a failure.
    weight: 2
  - type: llm
    name: reactions-quote-the-screen-and-do-not-praise
    criteria: |
      Each persona's reason quotes the words on screen (a few words in quotation marks) and is specific; no persona gives «حلو» or «احترافي» or praise of the team or the effort as a reason, and where something is unclear the persona says «مش فاهم» instead of guessing the writer's meaning.
    focus: trace
    weight: 2
  - type: llm
    name: personas-differ
    criteria: |
      The three personas differ from each other (place, dialect, moment and what annoys them) and react differently where their profiles differ; the answers are not three copies of one reaction.
    weight: 2
  - type: regex
    name: no-author-credit
    pattern: 'محمد عبده|Mohamed Abdou'
    match: not_contains
    weight: 2
expected_outcome: "A drop-off map that finds the generic slide, with specific, quoted, unflattering reactions."
