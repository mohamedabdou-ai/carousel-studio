schema_version: "1.0"
name: bhv-27-canva-request-redirect
description: "A request to edit inside Canva is declined honestly and no Studio flow starts."
tags: [behaviour, chat-only, carousel-create, carousel-design, routing, canva]
plugins: ["../../../plugins/carousel-studio"]
execution:
  prompt: |
    عدّلي التصميم بتاعي في كانفا: غيّر الخط والألوان والصورة.
  append_system_prompt: |
    This is an automated evaluation of the Carousel Studio plugin, not a live session. There is no Artifact tool, no network access and no connected image, video or design tool. Save every file you create in the current working directory and never in a home folder: name the post spec spec.json, a brand profile brand.json and a plan plan-YYYY-MM.json, and when a script offers a workspace or root option (for example brand_io.py --dir) point it at the current directory. Otherwise answer the user exactly as you normally would.
  max_turns: 10
  timeout_seconds: 400
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 2
graders:
  - type: tool_used
    name: starts-no-carousel-studio-skill
    tool: Skill
    input_match: 'carousel-create|carousel-design|content-angles|brand-setup|content-plan|visual-prompts|arabic-proofread'
    min: 0
    max: 0
    arm: both
    weight: 2
  - type: llm
    name: does-not-pretend-to-edit-canva
    criteria: |
      The assistant says that it cannot open or edit the design inside Canva (it has no access) and does not claim to have changed the font, colours or picture. Offering another way to help is fine.
    weight: 3
  - type: llm
    name: answers-in-the-users-dialect
    criteria: |
      The reply is written in the user's own dialect rather than in formal Arabic or in English (tool, font and file names may stay Latin) and does not paste a whole slide script or a whole caption into the chat.
expected_outcome: "An honest, short answer; no pretend editing."
