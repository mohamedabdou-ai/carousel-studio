schema_version: "1.0"
name: bhv-15-arabic-indic-optin-everywhere
description: "A brand that opted into Arabic-Indic digits gets them everywhere, with one system per design."
tags: [behaviour, needs-bash, carousel-create, arabic-proofread, digits]
plugins: ["../../../plugins/carousel-studio"]
execution:
  prompt: |
    ده كابسول البراند بتاعي (ملف المشروع):

    [Carousel Studio brand capsule v1]
    brand: الدليل المالي (financial-guide) | dialect: msa-white | register: msa | digits: arabic-indic | swipe: arrow-rtl
    voice: رسمي هادئ، جمل واضحة. نستخدم «تدريجيا».
    palette: bg #F7F3EA ink #1D2A20 accent #2F6B3F | fonts: alexandria / noto-sans-arabic / inter | preset: poster
    home: -

    بسرعة: كاروسيل 8 سلايدات عن 5 عادات للادخار الشهري.
  append_system_prompt: |
    This is an automated evaluation of the Carousel Studio plugin, not a live session. There is no Artifact tool, no network access and no connected image, video or design tool. Save every file you create in the current working directory and never in a home folder: name the post spec spec.json, a brand profile brand.json and a plan plan-YYYY-MM.json, and when a script offers a workspace or root option (for example brand_io.py --dir) point it at the current directory. Otherwise answer the user exactly as you normally would.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Write, Edit, Bash, Glob, Grep]
runs: 2
graders:
  - type: tool_used
    name: uses-carousel-create
    tool: Skill
    input_match: 'carousel-create'
    min: 1
  - type: file_exists
    name: spec-json-written
    path: "**/spec.json"
  - type: regex
    name: digits-setting-is-arabic-indic
    pattern: '"digits"\s*:\s*"arabic-indic"'
    target: {source: file, path: spec.json}
    weight: 2
  - type: llm
    name: one-digit-system
    criteria: |
      In the slides and the caption pack of spec.json every numeral that appears in text is written with Arabic-Indic digits and none with Western digits; ids, timestamps and technical fields are exempt.
    focus: {source: file, path: spec.json}
    weight: 3
expected_outcome: "Arabic-Indic digits in every text field."
