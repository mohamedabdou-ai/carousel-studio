schema_version: "1.0"
name: bhv-31-brand-onboarding-dialect-first
description: "The setup opens with the dialect question, at most two questions, numbered choices and a progress line."
tags: [behaviour, chat-only, brand-setup, brand, onboarding]
plugins: ["../../../plugins/carousel-studio"]
execution:
  prompt: |
    عايز أبدأ براند جديد.
  append_system_prompt: |
    This is an automated evaluation of the Carousel Studio plugin, not a live session. There is no Artifact tool, no network access and no connected image, video or design tool. Save every file you create in the current working directory and never in a home folder: name the post spec spec.json, a brand profile brand.json and a plan plan-YYYY-MM.json, and when a script offers a workspace or root option (for example brand_io.py --dir) point it at the current directory. Otherwise answer the user exactly as you normally would.
  max_turns: 10
  timeout_seconds: 400
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 2
graders:
  - type: tool_used
    name: uses-brand-setup
    tool: Skill
    input_match: 'brand-setup'
    min: 1
  - type: llm
    name: dialect-first-two-questions
    criteria: |
      The first reply is short and in Egyptian dialect. The first question asks which dialect the brand writes in, with numbered choices that include Egyptian, Gulf, Levantine, simplified MSA and English. The reply holds at most two questions in all, shows a progress line (for example القسم 1 من 6) or says the setup has 6 short sections, and does not yet ask about digits, colours or fonts.
    weight: 3
  - type: regex
    name: at-most-two-question-marks
    pattern: '\u061F[^\u061F]*\u061F[^\u061F]*\u061F'
    match: not_contains
    flags: "u"
  - type: llm
    name: answers-in-the-users-dialect
    criteria: |
      The reply is written in the user's own dialect rather than in formal Arabic or in English (tool, font and file names may stay Latin) and does not paste a whole slide script or a whole caption into the chat.
expected_outcome: "A short, dialect-first opening with at most two questions."
