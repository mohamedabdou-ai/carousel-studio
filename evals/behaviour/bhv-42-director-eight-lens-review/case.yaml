schema_version: "1.0"
name: bhv-42-director-eight-lens-review
description: "Team fast ends with QA export/veto and a fresh Creative Director compact final review: eight evidence-backed lenses, no panel and one revision loop."
tags: [behaviour, needs-bash, carousel-create, creative-team, director-review]
plugins: ["../../../plugins/carousel-studio"]
execution:
  prompt: |
    ده كابسول البراند بتاعي (ملف المشروع):

        [Carousel Studio brand capsule v1]
        brand: ورشة المحتوى (content-workshop) | dialect: eg | register: dialect | digits: western | swipe: arrow-rtl
        voice: ودود وعملي، جمل قصيرة. نستخدم «ببلاش» و«جرّب». لا نستخدم «ثورة» ولا «سر».
        palette: bg #F4F4F2 ink #111111 accent #E3262B | fonts: ibm-plex-sans-arabic / readex-pro / inter | preset: creator
        home: -

    بسرعة: كاروسيل 8 سلايدات عن ليه الكابشن الطويل مش عيب. قبل ما تسلّمني، عايز مراجعة المدير الإبداعي. الهوك والستايل اختارهما زي ما تشوف، وقل لي اختيارك قبل التصميم.
  append_system_prompt: |
    This is an automated evaluation of the Carousel Studio plugin, not a live session. There is no Artifact tool, no network access and no connected image, video or design tool. Save every file you create in the current working directory and never in a home folder: name the post spec spec.json, the production board board.md, a brand profile brand.json and a plan plan-YYYY-MM.json, and when a script offers a workspace or root option (for example brand_io.py --dir) point it at the current directory. Subagents may be unavailable: when they are, run each team role as an explicit role pass, as the skill says. Otherwise answer the user exactly as you normally would.
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [Skill, Read, Write, Edit, Bash, Glob, Grep, Agent]
runs: 2
graders:
  - type: tool_used
    name: uses-carousel-create
    tool: Skill
    input_match: 'carousel-create'
    min: 1
  - type: regex
    name: verdict
    pattern: 'SHIP|REVISE|KILL'
    match: contains
    weight: 2
  - type: regex
    name: compact-review-scores
    pattern: '(?s)الفكرة\s+[1-5]\s+—.*الهوك\s+[1-5]\s+—.*التدفق\s+[1-5]\s+—.*القيمة\s+[1-5]\s+—.*الصوت\s+[1-5]\s+—.*الصنعة\s+[1-5]\s+—.*الدليل\s+[1-5]\s+—.*الدعوة\s+[1-5]\s+—'
    match: contains
    target: {source: file, path: review-final.md}
    weight: 2
  - type: tool_used
    name: runs-the-board-checker
    tool: Bash
    input_match: 'board_check\.py[^\n]*--stage\s+fast'
    min: 1
    weight: 2
  - type: llm
    name: eight-lenses-scored-with-evidence
    criteria: |
      The director's review scores EIGHT lenses (idea, hook, flow, value, voice, craft, proof, call to action) from 1 to 5, one line each that quotes evidence (a slide number, a field, QA or art evidence), and ends with exactly one verdict: SHIP, REVISE or KILL.
    weight: 2
  - type: llm
    name: verdict-follows-the-scores
    criteria: |
      The verdict follows the rules: SHIP only if every lens is 4 or more and no unresolved veto/BLOCK or failed promise remains. No panel runs: print اللجنة: لم تُشغَّل; never invent panel results; KILL if Idea or Hook is 2 or less; otherwise REVISE with one to three notes and at most one loop (fix pass → QA export → fresh review). QA runs the full export itself with --brand before this review, opens every full-size slide and the 130 px sheet. If the verdict is REVISE, each note is addressed to one named role (copywriter, art director, motion designer...) and says what to change, not how to write it.
    weight: 2
  - type: regex
    name: no-author-credit
    pattern: 'محمد عبده|Mohamed Abdou'
    match: not_contains
    weight: 2
expected_outcome: "QA export/veto then fresh compact final review, no panel, eight scored lenses and one bounded revision loop."
