schema_version: "1.0"
name: bhv-34-dialect-purity-flags-gulf-in-egyptian
description: "Gulf words inside an Egyptian post are flagged as leaks with Egyptian suggestions and a VETO."
tags: [behaviour, needs-bash, arabic-proofread, proofread, one-dialect]
plugins: ["../../../plugins/carousel-studio"]
execution:
  prompt: |
    راجع النص ده، المفروض مصري بس: "ابغى اعرف ليش الكاروسيل ما ينحفظ، وش الغلط اللي بسويه؟"
  append_system_prompt: |
    This is an automated evaluation of the Carousel Studio plugin, not a live session. There is no Artifact tool, no network access and no connected image, video or design tool. Save every file you create in the current working directory and never in a home folder: name the post spec spec.json, a brand profile brand.json and a plan plan-YYYY-MM.json, and when a script offers a workspace or root option (for example brand_io.py --dir) point it at the current directory. Otherwise answer the user exactly as you normally would.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Write, Edit, Bash, Glob, Grep]
runs: 2
graders:
  - type: tool_used
    name: runs-the-orthography-lint
    tool: Bash
    input_match: 'ortho_lint\.py'
    min: 1
  - type: llm
    name: leaks-found-with-suggestions
    criteria: |
      The reply flags ابغى، ليش، وش and بسويه as Gulf words in an Egyptian post and suggests Egyptian replacements.
    weight: 3
  - type: regex
    name: verdict-is-veto
    pattern: 'VETO'
    weight: 2
  - type: llm
    name: allow-list-explained
    criteria: |
      The reply mentions that the user can keep a word by saying اللهجة كده صح.
expected_outcome: "The leaks are named and the verdict is VETO."
