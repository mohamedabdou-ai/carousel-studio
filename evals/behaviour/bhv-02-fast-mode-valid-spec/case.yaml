schema_version: "1.0"
name: bhv-02-fast-mode-valid-spec
description: "Fast mode delegates hook/style at checkpoint A, picks the top angle and writes a valid spec before checkpoint B."
tags: [behaviour, needs-bash, carousel-create, valid-spec, fast-mode, flow]
plugins: ["../../../plugins/carousel-studio"]
execution:
  prompt: |
    ده كابسول البراند بتاعي (ملف المشروع):

    [Carousel Studio brand capsule v1]
    brand: ورشة المحتوى (content-workshop) | dialect: eg | register: dialect | digits: western | swipe: arrow-rtl
    voice: ودود وعملي، جمل قصيرة. نستخدم «ببلاش» و«جرّب». لا نستخدم «ثورة» ولا «سر».
    palette: bg #F4F4F2 ink #111111 accent #E3262B | fonts: ibm-plex-sans-arabic / readex-pro / inter | preset: swiss
    home: -

    بسرعة (فاست مود): كاروسيل 8 سلايدات عن 5 أخطاء بتموّت الكاروسيل. اختار إنت أحسن زاوية وكمّل. الهوك والستايل زي ما تشوف.
  append_system_prompt: |
    This is an automated evaluation of the Carousel Studio plugin, not a live session. There is no Artifact tool, no network access and no connected image, video or design tool. Save every file you create in the current working directory and never in a home folder: name the post spec spec.json, a brand profile brand.json and a plan plan-YYYY-MM.json, and when a script offers a workspace or root option (for example brand_io.py --dir) point it at the current directory. Otherwise answer the user exactly as you normally would.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Write, Edit, Bash, Glob, Grep]
runs: 2
graders:
  - type: tool_used
    name: uses-carousel-create
    tool: Skill
    input_match: 'carousel-create'
    min: 1
  - type: file_exists
    name: spec-json-written
    path: "**/spec.json"
  - type: tool_used
    name: validates-the-spec
    tool: Bash
    input_match: 'validate\.py'
    min: 1
  - type: regex
    name: mode-is-fast
    pattern: '"mode"\s*:\s*"fast"'
    target: {source: file, path: spec.json}
  - type: regex
    name: dialect-is-eg
    pattern: '"dialect"\s*:\s*"eg"'
    target: {source: file, path: spec.json}
  - type: regex
    name: digits-are-western
    pattern: '"digits"\s*:\s*"western"'
    target: {source: file, path: spec.json}
  - type: llm
    name: four-to-ten-slides
    criteria: |
      spec.json holds between 4 and 10 slides; the first has type cover and the last has type cta.
    focus: {source: file, path: spec.json}
    weight: 2
  - type: llm
    name: names-the-angle-it-picked
    criteria: |
      The reply says which angle, hook and style it picked under the explicit delegation at checkpoint A, and stops at checkpoint B for design approval.
    weight: 2
expected_outcome: "A spec.json that validates; the reply names the angle it chose."
