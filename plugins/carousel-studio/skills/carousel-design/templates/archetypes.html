<style id="cs-archetype-css">
/* ============================================================
   Carousel Studio · archetype layout · engine cs-1.1.1
   Archetypes own LAYOUT; presets own LOOK. This sheet therefore contains
     1. token wiring   - fonts, weights, line heights and base colours read from the --cs-* custom properties
                         (CONTRACT 6.2). A preset never sets a font family or a font size; it restyles through
                         decor.css, whose selectors are more specific than everything below.
     2. layers & chrome - bg, decor, header and footer bands, placed from the preset's slot choices.
     3. one block per slide type (20) with its variants.
   Rules of this file: logical properties only (the same CSS mirrors for dir="ltr"); no colour literals, no
   border radius, no shadows, no filters, masks, blend modes, writing-mode, viewport units or animation;
   text is never letter-spaced or justified and never loses its natural word breaks.
   Geometry (CONTRACT 3.4, draft 9.1): canvas 1080 wide; content box x 114-966; header band y 165-245; footer band 1165-1245 (items top-aligned, 49 px high);
   body area y 261 to the footer band - 16. Inner slides (spec S-1) may sit lower and narrower: the engine says so through --cs-pad-bottom, --cs-body-h and
   --cs-footer-pad-x (60 px on each side, added to the content inset); this sheet only reads them. Recipes (spec 4.2; staged under over full center): data-recipe
   on .cs-content and the optional .cs-anchor-slot (hooks: --cs-anchor-min -max -seam, --cs-bullet-indent -h, --cs-rail-w, --cs-table-key).
   ============================================================ */

/* ---- 1. root and token wiring ---------------------------------------- */
.cs-slide{
  position:relative; box-sizing:border-box; overflow:hidden; contain:layout;
  inline-size:var(--cs-w,1080px); block-size:var(--cs-h,1440px); margin:0; padding:0; isolation:isolate;
  background-color:var(--cs-bg); color:var(--cs-ink);
  font-family:var(--cs-font-body); font-weight:var(--cs-wght-body); font-size:var(--cs-fs-body); line-height:var(--cs-lh-body);
  font-style:normal; font-synthesis:none; font-kerning:normal; font-variant-ligatures:normal; font-feature-settings:normal;
  letter-spacing:0; word-spacing:0; text-transform:none; text-indent:0; text-decoration:none; text-align:start;
  -webkit-text-size-adjust:100%; text-size-adjust:100%; -webkit-font-smoothing:antialiased;
}
.cs-slide *{ box-sizing:border-box; margin:0; padding:0; letter-spacing:0; word-spacing:0; font-style:normal; font-synthesis:none; }
.cs-slide > style{ display:none; }

.cs-slide .w{ white-space:nowrap; }
.cs-slide .cs-ln{ display:block; white-space:nowrap; }
.cs-slide .cs-em{ background:none; color:inherit; font-weight:inherit; }
.cs-slide .cs-ltr{ font-family:var(--cs-font-latin); font-weight:var(--cs-wght-latin); }
.cs-slide[dir="rtl"] .cs-ltr{ white-space:nowrap; }
.cs-slide .cs-kashida{ white-space:nowrap; }

/* ---- 2. layers ---------------------------------------- */
.cs-slide .cs-bg,
.cs-slide .cs-decor{ position:absolute; inset:0; pointer-events:none; }
.cs-slide .cs-bg{ z-index:0; background-color:var(--cs-bg); background-image:var(--cs-bg-image); background-size:cover; background-position:center; }
.cs-slide .cs-decor{ z-index:1; }
.cs-slide .cs-bg > .cs-media-slot{ position:absolute; inset:0; inline-size:100%; block-size:100%; margin:0; }
.cs-slide .cs-bg > .cs-media-slot > img,
.cs-slide .cs-bg > .cs-media-slot > video{ display:block; inline-size:100%; block-size:100%; object-fit:cover; object-position:center; }

.cs-slide .cs-header,
.cs-slide .cs-footer{
  position:absolute; inset-inline:var(--cs-pad-x); z-index:3;
  display:grid; grid-template-columns:minmax(max-content,1fr) auto minmax(max-content,1fr); column-gap:var(--cs-gutter);
  font-family:var(--cs-font-body); font-weight:var(--cs-wght-body); font-size:var(--cs-fs-micro); line-height:1.3; color:var(--cs-ink-muted);
}
.cs-slide .cs-header{ inset-block-start:var(--cs-pad-top); block-size:var(--cs-header-h); align-items:center; }
.cs-slide .cs-footer{ inset-block-end:var(--cs-pad-bottom); inset-inline:calc(var(--cs-pad-x) + var(--cs-footer-pad-x, 0px)); block-size:var(--cs-footer-h); align-items:start; }
.cs-slide .cs-header > *,
.cs-slide .cs-footer > *{ min-inline-size:0; white-space:nowrap; grid-row:1; }
.cs-slide .cs-header > [data-pos="start"],  .cs-slide .cs-footer > [data-pos="start"]{ grid-column:1; justify-self:start; }
.cs-slide .cs-header > [data-pos="center"], .cs-slide .cs-footer > [data-pos="center"]{ grid-column:2; justify-self:center; }
.cs-slide .cs-header > [data-pos="end"],    .cs-slide .cs-footer > [data-pos="end"]{ grid-column:3; justify-self:end; }
/* the swipe cue sits on the edge it points to: an Arabic slide shown to an English-UI audience (and the reverse) swaps the outer columns */
.cs-slide[dir="rtl"] .cs-footer[data-swipe="arrow-ltr"] > [data-pos="start"],
.cs-slide[dir="ltr"] .cs-footer[data-swipe="arrow-rtl"] > [data-pos="start"]{ grid-column:3; justify-self:end; }
.cs-slide[dir="rtl"] .cs-footer[data-swipe="arrow-ltr"] > [data-pos="end"],
.cs-slide[dir="ltr"] .cs-footer[data-swipe="arrow-rtl"] > [data-pos="end"]{ grid-column:1; justify-self:start; }

.cs-slide .cs-header > *{ display:inline-flex; align-items:center; gap:calc(var(--cs-unit) * 1.5); block-size:calc(var(--cs-unit) * 7); max-inline-size:100%; }
.cs-slide .cs-footer > *{ display:inline-flex; align-items:center; gap:calc(var(--cs-unit) * 1.25); block-size:var(--cs-footer-item-h); max-block-size:var(--cs-footer-item-h); }
.cs-slide .cs-handle{ color:var(--cs-ink); }
.cs-slide .cs-handle > img{ display:block; block-size:calc(var(--cs-unit) * 7); inline-size:auto; max-inline-size:calc(var(--cs-unit) * 25); object-fit:contain; transform:none; }
.cs-slide .cs-meta{ overflow:hidden; text-overflow:ellipsis; }
.cs-slide .cs-counter{ font-variant-numeric:tabular-nums; }
.cs-slide .cs-savepill{ font-size:var(--cs-fs-small); color:var(--cs-ink); }
/* A hand-designed (free) CTA carries its own ask, so the footer save pill steps aside and the counter keeps its place (D2.chrome-drift). */
.cs-slide[data-free="1"][data-type="cta"] .cs-savepill{ display:none; }
.cs-slide .cs-savepill > svg, .cs-slide .cs-swipe > svg{ flex:none; inline-size:1em; block-size:1em; }

/* ---- 3. content stack ---------------------------------------- */
.cs-slide .cs-content{
  position:absolute; z-index:2; inset-inline:var(--cs-pad-x); inset-block-start:var(--cs-body-top); block-size:var(--cs-body-h);
  display:flex; flex-direction:column; justify-content:flex-start; align-items:stretch; gap:calc(var(--cs-unit) * 4);
  padding-block:calc(var(--cs-unit) * 1); /* the stack never touches the header rule above it or the footer rule below it; fit measures inside this padding */
  text-align:var(--cs-text-align);
}
.cs-slide .cs-slot{ position:relative; z-index:1; min-inline-size:0; max-inline-size:100%; overflow-wrap:normal; word-break:normal; hyphens:manual; }
.cs-slide .cs-content > *{ flex:0 0 auto; }
.cs-slide [data-edit]:empty{ min-block-size:1.4em; }

/* typographic roles: family, weight, line height and the starting size (fit lowers the size, never the tracking) */
.cs-slide [data-role="hero"]{   font-family:var(--cs-font-display); font-weight:var(--cs-wght-display); font-size:var(--cs-fs-hero);  line-height:var(--cs-lh-display); text-wrap:balance; }
.cs-slide [data-role="h1"]{     font-family:var(--cs-font-display); font-weight:var(--cs-wght-display); font-size:var(--cs-fs-h1);    line-height:var(--cs-lh-display); text-wrap:balance; }
.cs-slide [data-role="h2"]{     font-family:var(--cs-font-heading); font-weight:var(--cs-wght-heading); font-size:var(--cs-fs-h2);    line-height:var(--cs-lh-heading); text-wrap:balance; }
.cs-slide [data-role="title"]{  font-family:var(--cs-font-heading); font-weight:var(--cs-wght-heading); font-size:var(--cs-fs-title); line-height:var(--cs-lh-heading); text-wrap:balance; }
.cs-slide [data-role="body"]{   font-family:var(--cs-font-body);    font-weight:var(--cs-wght-body);    font-size:var(--cs-fs-body);  line-height:var(--cs-lh-body);    text-wrap:pretty; }
.cs-slide [data-role="small"]{  font-family:var(--cs-font-body);    font-weight:var(--cs-wght-body);    font-size:var(--cs-fs-small); line-height:calc(var(--cs-lh-body) * .9); text-wrap:pretty; color:var(--cs-ink-muted); }
.cs-slide [data-role="micro"]{  font-family:var(--cs-font-body);    font-weight:var(--cs-wght-body);    font-size:var(--cs-fs-micro); line-height:calc(var(--cs-lh-body) * .9); color:var(--cs-ink-muted); }
.cs-slide [data-role="number"]{ font-family:var(--cs-font-display); font-weight:var(--cs-wght-display); font-size:calc(var(--cs-fs-hero) * 2); line-height:1; }
.cs-slide .cs-kicker, .cs-slide .cs-bridge, .cs-slide .cs-attribution{ color:var(--cs-ink-muted); }
.cs-slide .cs-sub{ color:var(--cs-ink); }

/* number kind: big figure plus unit, never wrapped */
.cs-slide .cs-number{ display:flex; align-items:baseline; justify-content:flex-start; gap:calc(var(--cs-unit) * 2); white-space:nowrap; }
.cs-slide[data-align="center"] .cs-number{ justify-content:center; }
.cs-slide .cs-number > [data-unit-join]{ display:inline-flex; align-items:baseline; gap:calc(var(--cs-unit) * .5); }
.cs-slide .cs-num{ font-variant-numeric:lining-nums; }
.cs-slide .cs-unit{ font-family:var(--cs-font-heading); font-weight:var(--cs-wght-heading); font-size:max(.3em, var(--cs-fs-small)); line-height:1; color:var(--cs-ink); }

/* ordinals: small label by default; the ghost look is a layout fact (an oversized numeral in the foot corner, behind the text), its colour is the preset's */
.cs-slide .cs-ord{ align-self:flex-start; font-variant-numeric:lining-nums; }
.cs-slide[data-align="center"] .cs-ord{ align-self:center; }
.cs-slide[data-variant="ghost-number"] .cs-ord{ position:absolute; z-index:0; inset-block-end:calc(var(--cs-unit) * 4); inset-inline-end:0; font-size:calc(var(--cs-fs-hero) * 2.6); line-height:.8; color:var(--cs-line); pointer-events:none; }
.cs-slide[data-variant="ghost-number"] .cs-content > .cs-slot:not(.cs-ord){ z-index:1; }

/* media slot */
.cs-slide .cs-media-slot{ display:flex; align-items:center; justify-content:center; overflow:hidden; min-inline-size:0; }
.cs-slide .cs-media-slot > img,
.cs-slide .cs-media-slot > video{ display:block; inline-size:100%; block-size:100%; object-fit:cover; }
.cs-slide .cs-media-slot[data-media-kind="cutout"] > img{ object-fit:contain; object-position:center bottom; }
.cs-slide .cs-media-slot[data-media-kind="screenshot"] > img,
.cs-slide .cs-media-slot[data-media-kind="ui"] > img{ object-fit:contain; object-position:center top; }
.cs-slide .cs-media-slot[data-media-kind="icon"]{ flex:0 0 auto; align-self:flex-start; inline-size:calc(var(--cs-unit) * 18); block-size:calc(var(--cs-unit) * 18); }
.cs-slide .cs-media-slot[data-media-kind="icon"] > svg,
.cs-slide .cs-media-slot[data-media-kind="icon"] > img{ inline-size:100%; block-size:100%; object-fit:contain; }
.cs-slide .cs-media-slot[data-mirror="1"] > svg,
.cs-slide .cs-media-slot[data-mirror="1"] > img{ transform:scaleX(-1); }
.cs-slide .cs-content > .cs-media-slot:not([data-media-kind="icon"]){ flex:1 1 0; min-block-size:calc(var(--cs-unit) * 30); }

/* bullets */
.cs-slide .cs-bullets{ list-style:none; display:flex; flex-direction:column; gap:calc(var(--cs-unit) * 2.5); }
.cs-slide .cs-bullet{ position:relative; display:block; padding-inline-start:var(--cs-bullet-indent, calc(var(--cs-unit) * 7)); min-block-size:var(--cs-bullet-h, 0px); }
.cs-slide .cs-bullet > [data-part="icon"]{ position:absolute; inset-inline-start:0; inset-block-start:0; }
.cs-slide .cs-content > .cs-bullets{ flex:0 1 auto; }

/* sides (compare, myth-fact) */
.cs-slide .cs-sides{ flex:0 0 auto; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-auto-rows:minmax(0,auto); align-items:stretch; gap:calc(var(--cs-unit) * 3); }
.cs-slide .cs-side{ display:flex; flex-direction:column; justify-content:flex-start; gap:calc(var(--cs-unit) * 1.5); min-inline-size:0; min-block-size:calc(var(--cs-unit) * 36); padding:calc(var(--cs-unit) * 3); }
.cs-slide .cs-side-label{ display:block; align-self:flex-start; font-family:var(--cs-font-body); font-weight:var(--cs-wght-body); font-size:var(--cs-fs-small); line-height:1.6; color:var(--cs-ink-muted); }
.cs-slide .cs-side-text{ display:block; margin:0; }
.cs-slide[data-variant="stacked"] .cs-sides{ grid-template-columns:minmax(0,1fr); }
.cs-slide[data-variant="stacked"] .cs-side{ min-block-size:calc(var(--cs-unit) * 20); }
.cs-slide[data-variant="versus"] .cs-side{ padding-inline:calc(var(--cs-unit) * 7); }
.cs-slide[data-variant="versus"] .cs-sides{ position:relative; }
.cs-slide[data-variant="versus"] .cs-sides::after{
  content:attr(data-vs); position:absolute; z-index:2; inset-block-start:50%; inset-inline-start:50%; transform:translate(-50%,-50%);
  display:flex; align-items:center; justify-content:center; text-align:center; box-sizing:border-box; min-inline-size:calc(var(--cs-unit) * 12); block-size:calc(var(--cs-unit) * 12);
  font-family:var(--cs-font-heading); font-weight:var(--cs-wght-heading); font-size:var(--cs-fs-micro); line-height:1.5; padding-inline:calc(var(--cs-unit) * 1.5);
  background:var(--cs-bg); color:var(--cs-ink);
}
.cs-slide[dir="rtl"][data-variant="versus"] .cs-sides::after{ transform:translate(50%,-50%); }
.cs-slide[data-variant="stamp"] .cs-a-myth-fact .cs-side:first-child .cs-side-label{ transform:rotate(-6deg); transform-origin:center; align-self:flex-start; }
.cs-slide .cs-a-myth-fact .cs-side:first-child .cs-side-text{ --cs-fit-ratio:.9; }

/* cta */
.cs-slide .cs-cta{ display:inline-flex; align-items:center; gap:calc(var(--cs-unit) * 2); align-self:flex-start; padding-inline:calc(var(--cs-unit) * 5); padding-block:calc(var(--cs-unit) * 1.5); max-inline-size:100%; }
.cs-slide[data-align="center"] .cs-content > .cs-cta{ align-self:center; }
.cs-slide .cs-cta-text{ display:block; min-inline-size:0; color:inherit; }
.cs-slide .cs-cta-icon{ flex:none; display:inline-block; inline-size:calc(var(--cs-unit) * 5); block-size:calc(var(--cs-unit) * 5); }
/* the arrow says "this goes somewhere": it belongs to the asks that do (follow, open a DM). A save, a send or a question is asked in place, so its button carries its words alone, symmetric */
.cs-slide .cs-cta[data-cta="save"] .cs-cta-icon, .cs-slide .cs-cta[data-cta="send"] .cs-cta-icon, .cs-slide .cs-cta[data-cta="question"] .cs-cta-icon{ display:none; }
.cs-slide[data-preset] .cs-cta[data-cta="save"], .cs-slide[data-preset] .cs-cta[data-cta="send"], .cs-slide[data-preset] .cs-cta[data-cta="question"]{ padding-inline:calc(var(--cs-unit) * 5); }
.cs-slide[data-variant="keyword"] .cs-a-cta .cs-cta{ align-self:stretch; justify-content:center; padding-block:calc(var(--cs-unit) * 5); }

/* bridge: the small line that pulls the swipe; pinned to the foot of the stack on list-like slides, and on centred slides
   (the group is centred between two spacers and the bridge, order 2, stays below them) */
.cs-slide .cs-bridge{ margin-block-start:calc(var(--cs-unit) * 2); order:10; }
.cs-slide .cs-a-item > .cs-bridge, .cs-slide .cs-a-step > .cs-bridge, .cs-slide .cs-a-story-beat > .cs-bridge,
.cs-slide .cs-a-checklist > .cs-bridge, .cs-slide .cs-a-setup > .cs-bridge, .cs-slide .cs-a-proof > .cs-bridge, .cs-slide .cs-a-grid > .cs-bridge, .cs-slide .cs-a-timeline > .cs-bridge{ margin-block-start:auto; }

/* ---- 4. archetypes ---------------------------------------- */
/* 1 cover · 18 poster: hero headline at the preset's width, anchored by variant */
.cs-slide .cs-a-cover, .cs-slide .cs-a-poster{ gap:calc(var(--cs-unit) * 2); justify-content:var(--cs-cover-justify); }
.cs-slide[data-variant="top"] .cs-a-cover,    .cs-slide[data-variant="top"] .cs-a-poster,
.cs-slide[data-variant="split"] .cs-a-cover,  .cs-slide[data-variant="split"] .cs-a-poster{ justify-content:flex-start; }
.cs-slide[data-variant="center"] .cs-a-cover, .cs-slide[data-variant="center"] .cs-a-poster{ justify-content:center; }
.cs-slide[data-variant="photo"] .cs-a-cover,  .cs-slide[data-variant="photo"] .cs-a-poster{ justify-content:flex-end; }
.cs-slide .cs-a-cover > .cs-headline, .cs-slide .cs-a-poster > .cs-headline{ inline-size:var(--cs-headline-w-max); align-self:flex-start; }
.cs-slide[data-align="center"] .cs-a-cover > .cs-headline, .cs-slide[data-align="center"] .cs-a-poster > .cs-headline{ align-self:center; }
.cs-slide .cs-a-cover > .cs-sub, .cs-slide .cs-a-poster > .cs-sub{ max-inline-size:calc(var(--cs-headline-w-max) + 10%); }
.cs-slide[data-align="center"] .cs-a-cover > .cs-sub, .cs-slide[data-align="center"] .cs-a-poster > .cs-sub{ align-self:center; }
.cs-slide[data-variant="center"] .cs-a-cover > .cs-media-slot:not([data-media-kind="icon"]),
.cs-slide[data-variant="center"] .cs-a-poster > .cs-media-slot:not([data-media-kind="icon"]){ flex:0 0 calc(var(--cs-unit) * 40); min-block-size:0; }
.cs-slide[data-variant="split"] .cs-a-cover > .cs-media-slot:not([data-media-kind="icon"]),
.cs-slide[data-variant="split"] .cs-a-poster > .cs-media-slot:not([data-media-kind="icon"]){ min-block-size:calc(var(--cs-unit) * 48); }
.cs-slide .cs-a-poster > .cs-bullets{ gap:calc(var(--cs-unit) * 2); }
/* a leading numeral becomes the visual anchor of the headline (variants "number" and "big-number") */
.cs-slide[data-variant="number"] .cs-a-cover .cs-headline .w[data-w="0"] > .cs-ltr[data-run="number"],
.cs-slide[data-variant="number"] .cs-a-cover .cs-headline .cs-ltr[data-run="number"]:has(> .w[data-w="0"]),
.cs-slide[data-variant="big-number"] .cs-a-rehook .cs-headline .w[data-w="0"] > .cs-ltr[data-run="number"],
.cs-slide[data-variant="big-number"] .cs-a-rehook .cs-headline .cs-ltr[data-run="number"]:has(> .w[data-w="0"]){ display:block; font-size:1.7em; line-height:.9; }
/* the numeral is an LTR run set as a block: it aligns like the headline around it (the right edge of an Arabic slide, the left of an English one, or the centre) */
.cs-slide[dir="rtl"][data-align="start"][data-variant="number"] .cs-a-cover .cs-headline :is(.w[data-w="0"] > .cs-ltr[data-run="number"], .cs-ltr[data-run="number"]:has(> .w[data-w="0"])),
.cs-slide[dir="rtl"][data-align="start"][data-variant="big-number"] .cs-a-rehook .cs-headline :is(.w[data-w="0"] > .cs-ltr[data-run="number"], .cs-ltr[data-run="number"]:has(> .w[data-w="0"])){ text-align:end; }
.cs-slide[data-align="center"][data-variant="number"] .cs-a-cover .cs-headline :is(.w[data-w="0"] > .cs-ltr[data-run="number"], .cs-ltr[data-run="number"]:has(> .w[data-w="0"])),
.cs-slide[data-align="center"][data-variant="big-number"] .cs-a-rehook .cs-headline :is(.w[data-w="0"] > .cs-ltr[data-run="number"], .cs-ltr[data-run="number"]:has(> .w[data-w="0"])){ text-align:center; }

/* centred stacks: a spacer above (order -9) and one below (order 9) the group; the bridge (order 10) stays at the foot */
.cs-slide .cs-a-rehook::before, .cs-slide .cs-a-rehook::after,
.cs-slide .cs-a-stat::before, .cs-slide .cs-a-stat::after,
.cs-slide .cs-a-compare::before, .cs-slide .cs-a-compare::after,
.cs-slide .cs-a-myth-fact::before, .cs-slide .cs-a-myth-fact::after,
.cs-slide .cs-a-quote::before, .cs-slide .cs-a-quote::after,
.cs-slide .cs-a-share::before, .cs-slide .cs-a-share::after,
.cs-slide .cs-a-cta::before, .cs-slide .cs-a-cta::after,
.cs-slide .cs-a-offer::before, .cs-slide .cs-a-offer::after,
.cs-slide .cs-a-testimonial::before, .cs-slide .cs-a-testimonial::after{ content:""; flex:1 1 0; min-block-size:0; margin:0; }
.cs-slide .cs-a-rehook::after, .cs-slide .cs-a-stat::after, .cs-slide .cs-a-compare::after, .cs-slide .cs-a-myth-fact::after,
.cs-slide .cs-a-quote::after, .cs-slide .cs-a-share::after, .cs-slide .cs-a-cta::after, .cs-slide .cs-a-offer::after, .cs-slide .cs-a-testimonial::after{ order:9; }
.cs-slide .cs-a-rehook::before, .cs-slide .cs-a-stat::before, .cs-slide .cs-a-compare::before, .cs-slide .cs-a-myth-fact::before,
.cs-slide .cs-a-quote::before, .cs-slide .cs-a-share::before, .cs-slide .cs-a-cta::before, .cs-slide .cs-a-offer::before, .cs-slide .cs-a-testimonial::before{ order:-9; }

/* "document" slides (item, step, story-beat and the lists) are centred the same way but sit a little above the middle: short copy no longer
   leaves half the canvas empty, long copy still fills it, and the bridge stays at the foot */
.cs-slide .cs-a-item::before, .cs-slide .cs-a-item::after,
.cs-slide .cs-a-step::before, .cs-slide .cs-a-step::after,
.cs-slide .cs-a-story-beat::before, .cs-slide .cs-a-story-beat::after,
.cs-slide .cs-a-checklist::before, .cs-slide .cs-a-checklist::after,
.cs-slide .cs-a-summary::before, .cs-slide .cs-a-summary::after,
.cs-slide .cs-a-setup::before, .cs-slide .cs-a-setup::after{ content:""; flex:1 1 0; min-block-size:0; margin:0; }
